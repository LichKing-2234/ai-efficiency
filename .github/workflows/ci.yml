name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      publish_web_image:
        description: Build and push the frontend-ng GHCR image
        required: false
        type: boolean
        default: false
      web_image_tag:
        description: Optional ai-efficiency-web image tag. Defaults to manual-<short-sha>.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AE_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Test backend
        working-directory: backend
        run: go test ./...

  ae-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: ae-cli/go.mod
          check-latest: false
          cache-dependency-path: ae-cli/go.sum
      - name: Test ae-cli
        working-directory: ae-cli
        run: go test ./...
      - name: E2E ae-cli discover
        working-directory: ae-cli
        run: |
          go build -o /tmp/ae-cli-e2e .
          bash test/discover-e2e.sh /tmp/ae-cli-e2e

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  frontend-ng:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      web_image_tag: ${{ steps.web_image_meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install frontend-ng dependencies
        working-directory: frontend-ng
        run: bun install --frozen-lockfile
      - name: Test frontend-ng
        working-directory: frontend-ng
        run: bun run test
      - name: Typecheck frontend-ng
        working-directory: frontend-ng
        run: bun run check
      - name: Build frontend-ng
        working-directory: frontend-ng
        run: bun run build
      - id: web_image_meta
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_web_image }}
        name: Prepare web image metadata
        run: |
          OWNER_LOWER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${GITHUB_SHA::12}"
          TAG="${{ inputs.web_image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="manual-$SHORT_SHA"
          fi
          echo "$TAG" | grep -Eq '^[A-Za-z0-9_.-]+$'
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$OWNER_LOWER/ai-efficiency-web:$TAG" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_web_image }}
      - uses: docker/setup-buildx-action@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_web_image }}
      - uses: docker/login-action@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_web_image }}
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend-ng GHCR image
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_web_image }}
        uses: docker/build-push-action@v6
        with:
          context: frontend-ng
          file: frontend-ng/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.web_image_meta.outputs.image }}
          build-args: |
            APP_VERSION=${{ steps.web_image_meta.outputs.tag }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILD_TIME=${{ steps.web_image_meta.outputs.build_time }}

  deploy-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate deploy shell script
        run: bash -n deploy/docker-deploy.sh
      - name: Validate compose configs
        run: |
          validate_compose() {
            local compose_file="$1"
            if docker compose --env-file deploy/.env.example -f "$compose_file" config >/dev/null 2>&1; then
              echo "validated with docker compose: $compose_file"
              return 0
            fi
            if command -v docker-compose >/dev/null 2>&1; then
              docker-compose --env-file deploy/.env.example -f "$compose_file" config >/dev/null
              echo "validated with docker-compose: $compose_file"
              return 0
            fi
            echo "no compatible compose implementation available" >&2
            exit 1
          }

          validate_compose deploy/docker-compose.yml
          validate_compose deploy/docker-compose.external.yml
      - name: Test docker bootstrap script
        run: bash deploy/test/docker-deploy-bootstrap-test.sh
