name: ae-cli Bridge Release

on:
  push:
    tags:
      - 'v0.2.0-cli.1'
  workflow_dispatch:
    inputs:
      tag:
        description: One-time CLI bridge release tag, exactly v0.2.0-cli.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      version_no_v: ${{ steps.meta.outputs.version_no_v }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          if [ "$TAG" != "v0.2.0-cli.1" ]; then
            echo "CLI bridge release tag must be exactly v0.2.0-cli.1: $TAG" >&2
            exit 1
          fi

          VERSION="$TAG"
          VERSION_NO_V="${VERSION#v}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "CLI bridge release tag v0.2.0-cli.1 must already exist before manual dispatch" >&2
            exit 1
          fi

          CHECKOUT_REF="refs/tags/$TAG"
          COMMIT_SHA="$(git rev-list -n 1 "refs/tags/$TAG")"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_no_v=$VERSION_NO_V" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

  test:
    name: verify / ae-cli bridge
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: ae-cli/go.mod
          check-latest: false
          cache-dependency-path: ae-cli/go.sum
      - name: Test ae-cli
        working-directory: ae-cli
        run: go test ./...
      - name: Test ae-cli installer
        run: bash ae-cli/test/install-test.sh

  ensure-release-tag:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    outputs:
      release_ref: ${{ steps.tag.outputs.release_ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - id: tag
        name: Ensure CLI bridge release tag exists
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          git rev-parse "refs/tags/$TAG" >/dev/null
          echo "release_ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"

  release:
    name: release / ae-cli bridge binaries
    needs: [prepare, ensure-release-tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.ensure-release-tag.outputs.release_ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: ae-cli/go.mod
          check-latest: false
          cache-dependency-path: ae-cli/go.sum
      - name: Build CLI bridge release artifacts
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --snapshot --clean --config .goreleaser.ae-cli.yaml
        env:
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          AE_CLI_VERSION: ${{ needs.prepare.outputs.version }}
          AE_CLI_VERSION_NO_V: ${{ needs.prepare.outputs.version_no_v }}
      - name: Verify CLI bridge artifact version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          VERSION_NO_V: ${{ needs.prepare.outputs.version_no_v }}
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT

          tar -xzf "dist/ae-cli_${VERSION_NO_V}_linux_amd64.tar.gz" -C "$smoke_dir" ae-cli
          actual="$("$smoke_dir/ae-cli" version)"
          expected="ae-cli $VERSION"
          if [ "$actual" != "$expected" ]; then
            echo "artifact version mismatch: got '$actual', want '$expected'" >&2
            exit 1
          fi
      - name: Publish CLI bridge release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            dist/ae-cli_*.tar.gz \
            dist/ae-cli_*.zip \
            dist/checksums.txt \
            --verify-tag \
            --latest \
            --title "ae-cli bridge $VERSION" \
            --notes "One-time bridge release for legacy ae-cli update check/install. This release intentionally becomes repository latest only to move old clients onto the independent ae-cli/v* updater path."
      - name: Verify CLI bridge release is repository latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          latest_tag="$(gh api "repos/$REPO/releases/latest" --jq .tag_name)"
          if [ "$latest_tag" != "$TAG" ]; then
            echo "CLI bridge release $TAG must become repository latest for legacy update discovery; got $latest_tag" >&2
            exit 1
          fi
